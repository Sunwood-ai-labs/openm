model_list:
  - model_name: claude-glm-code
    litellm_params:
      model: zai/glm-5.1
      api_key: os.environ/ZAI_API_KEY

  - model_name: claude-glm-main
    litellm_params:
      model: zai/glm-5-turbo
      api_key: os.environ/ZAI_API_KEY

router_settings:
  enable_pre_call_checks: true
  num_retries: 2
  retry_after: 1

litellm_settings:
  drop_params: true
  redact_user_api_key_info: true
  set_verbose: false

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
