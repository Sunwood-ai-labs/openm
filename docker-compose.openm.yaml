services:
  openm:
    build:
      context: .
      dockerfile: Dockerfile
    image: openm:0.1.0
    restart: unless-stopped
    ports:
      - "3000:8080"
    env_file:
      - path: .env.openm
        required: false
    environment:
      OPENM_LITELLM_BASE_URL: http://litellm:4000
    volumes:
      - openm-data:/app/backend/data
    depends_on:
      litellm:
        condition: service_healthy

  litellm:
    image: ghcr.io/berriai/litellm:v1.92.0
    restart: unless-stopped
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    env_file:
      - path: .env.openm
        required: false
    volumes:
      - ./config/litellm.yaml:/app/config.yaml:ro
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  openm-data:
