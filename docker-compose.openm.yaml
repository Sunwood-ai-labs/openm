services:
  openm:
    build:
      context: .
      dockerfile: Dockerfile
    image: openm:0.1.0
    restart: unless-stopped
    ports:
      - "${OPENM_HOST_PORT:-3000}:8080"
    env_file:
      - path: .env.openm
        required: false
    environment:
      OPENM_LITELLM_BASE_URL: http://litellm:4000
      OPENM_AGENT_MODE: ${OPENM_AGENT_MODE:-demo}
      OPENM_LITELLM_TOKEN: ${OPENM_LITELLM_TOKEN:-sk-openm-local}
      RAG_EMBEDDING_ENGINE: openai
      RAG_OPENAI_API_BASE_URL: http://127.0.0.1:9/v1
      RAG_OPENAI_API_KEY: disabled
      ENABLE_OLLAMA_API: "false"
      ENABLE_OPENAI_API: "true"
      OPENAI_API_BASE_URL: http://litellm:4000/v1
      OPENAI_API_BASE_URLS: http://litellm:4000/v1
      OPENAI_API_KEY: ${LITELLM_MASTER_KEY:-sk-openm-local}
      OPENAI_API_KEYS: ${LITELLM_MASTER_KEY:-sk-openm-local}
    volumes:
      - openm-data:/app/backend/data
    depends_on:
      litellm:
        condition: service_healthy

  litellm:
    image: ghcr.io/berriai/litellm:v1.92.0
    restart: unless-stopped
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    env_file:
      - path: .env.openm
        required: false
    environment:
      ZAI_API_KEY: ${ZAI_API_KEY:?ZAI_API_KEY must be provided}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-openm-local}
    volumes:
      - ./config/litellm.yaml:/app/config.yaml:ro
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  openm-data:
